<h2>The marker scribble, across the app</h2>
<p class="subtitle">The lime marker becomes Kejar's "hype" language. Six screens show it, ending with results as scribble plus victory lap. Each phone has a replay button. Click the screens where you like it.</p>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- hand-drawn wobble -->
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2"/>
    </filter>
    <!-- sticker: thick white edge plus a drop shadow -->
    <filter id="stk" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4.5" result="d"/>
      <feFlood flood-color="#F5F5F3"/><feComposite in2="d" operator="in" result="w"/>
      <feOffset in="w" dy="3.5" result="o"/><feFlood flood-color="#000" flood-opacity=".55"/><feComposite in2="o" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge>

  </defs>
</svg>

  // draw marker paths one after another; dark paths are for scribbles on lime
  function scribble(id, paths, start = 200, gap = 280, dur = 420) {
    const svg = $('s-' + id)
    svg.style.filter = 'url(#wob)'
    svg.innerHTML = `<g>${paths.map((p) => `<path class="${p.dk ? 'dk' : ''}" d="${p.d || p}"/>`).join('')}</g>`
    svg.querySelectorAll('path').forEach((p, i) => {
      const L = p.getTotalLength() + 2
      p.animate([{ strokeDasharray: `${L}`, strokeDashoffset: L }, { strokeDasharray: `${L}`, strokeDashoffset: 0 }],
        { duration: dur, delay: start + i * gap, easing: 'ease-in-out', fill: 'both' })
    })
  }
  function box(id, elId) {
    const pr = $('s-' + id).getBoundingClientRect(), r = $(elId).getBoundingClientRect()
    // text boxes include line-height; use the box as is
    return { x: r.left - pr.left, y: r.top - pr.top, w: r.width, h: r.height }
  }
  function ring(id, elId, padX = 16, padY = 12) {
    const b = box(id, elId), cx = b.x + b.w / 2, cy = b.y + b.h / 2, rx = b.w / 2 + padX, ry = b.h / 2 + padY, k = 1.36
    return `M${cx + rx * .15} ${cy - ry} C${cx + rx * k} ${cy - ry * 1.02} ${cx + rx * k} ${cy + ry * 1.02} ${cx} ${cy + ry} C${cx - rx * k} ${cy + ry} ${cx - rx * k} ${cy - ry * 1.08} ${cx + rx * .35} ${cy - ry * 1.06}`
  }

    const b = box(id, elId), y = b.y + b.h + dy
    return `M${b.x + inset - 4} ${y} Q${b.x + b.w / 2} ${y - 6} ${b.x + b.w - inset + 6} ${y}`
  }

      html: `<div class="ab eb" style="left:16px;top:18px">DIKEJAR · CAUGHT</div>
        <div class="ab big" style="left:16px;top:42px;font-size:34px"><span id="t-ben">Ben</span> got you.</div>
        <div class="ab muted" style="left:16px;top:84px">Hailat bro.</div>
        <div class="ab map" style="left:12px;right:12px;top:112px;height:230px"><div class="dot" style="left:30%;top:75%"></div>
          <div class="ab eb" style="left:150px;top:26px;color:#F5F5F3">PENJARA</div></div>
        <div class="ab" style="left:16px;right:16px;top:356px;font:500 11px 'Geist Mono',monospace;letter-spacing:.08em;color:#C6FF3D">180 M · WALK STRAIGHT THERE</div>`,
      play: () => scribble('penjara', [under('penjara', 't-ben', 4), 'M76 286 C96 250 70 220 110 196 S150 176 170 160', 'M160 140 L188 168 M188 140 L160 168', 'M156 132 C196 128 198 176 172 178 C146 180 140 136 172 130'], 200, 380, 520)
    },
    {
      id: 'results', t: '6. Results: victory lap + scribble', d: "Your mix: the winning side's sticker drives across with the banner, then the marker circles the winner, underlines it, adds stars and points at the top award.",
      html: `<div class="ab eb" style="left:12px;top:18px">GAME OVER</div>
        <div class="ab big" id="t-res" style="left:16px;top:44px;font-size:30px">Dikejar win<span style="color:#C6FF3D">.</span></div>
        <div class="ab" style="left:12px;right:12px;top:100px;display:flex;flex-direction:column;gap:6px">
          <div class="row"><div><div class="l">LONGEST SURVIVOR</div>Aina #07</div><span class="v">38m</span></div>
          <div class="row"><div><div class="l">MOST CATCHES</div>Ben</div><span class="v">4</span></div>
          <div class="row"><div><div class="l">PENJARA HERO</div>Hafiz #03</div><span class="v">3</span></div></div>
        <div class="ab" id="lapbox" style="inset:0"></div>`,
      play: () => {
        $('s-results').innerHTML = ''
        $('lapbox').innerHTML = `<div class="lap" id="lap"><div class="s">${sticker('gostan')}</div><div class="ban">DIKEJAR WIN!</div></div>`
        $('lap').animate([{ transform: 'translateX(260px)' }, { transform: 'translateX(-340px)' }], { duration: 2600, easing: 'cubic-bezier(.45,.05,.55,.95)', fill: 'forwards' })
        setTimeout(() => scribble('results', [ring('results', 't-res', 14, 12), under('results', 't-res', 16), under('results', 't-res', 22, 10), starP(204, 30, .9), starP(8, 22, .6), 'M226 150 Q234 124 210 116 M210 116 l11 -1 M210 116 l3 11'], 0, 300), 1400)
      }
    },
  ]

  $('cards').innerHTML = SCREENS.map((s) => `
    <div class="card" data-choice="scribble-${s.id}" onclick="toggleSelect(this)">
      <div class="card-image" style="background:#000;padding:12px">
        <div class="kj-phone">${s.html}<svg class="scr" id="s-${s.id}" viewBox="0 0 236 440"></svg></div>
        <div class="btns"><button onclick="event.stopPropagation(); play('${s.id}')">Replay</button></div>
      </div>
      <div class="card-body"><h3>${s.t}</h3><p>${s.d}</p></div>
    </div>`).join('') + `
    <div class="card" data-choice="scribble-rules" onclick="toggleSelect(this)">
      <div class="card-body"><h3>Rules for the marker (my suggestion)</h3><p>
        <b>Shapes only, never handwriting:</b> circles, underlines, arrows, stars, ticks, X's and burst marks. All text stays in Geist.<br><br>
        <b>Lime on black, black on lime.</b> One marker weight everywhere.<br><br>
        <b>Hype and wayfinding only:</b> your side, wins, power-ups, check-ins, the way to Penjara.<br><br>
        <b>Never on safety:</b> no scribbles on SOS, marshal screens, pause, removal or reports. Those stay clean and calm.<br><br>
        <b>One scribble moment per screen,</b> drawn once in under 2 s, then it stays still.<br><br>
        <b>Reduced motion:</b> the marks appear already drawn, without the drawing animation.</p></div>
    </div>`
  const play = (id) => SCREENS.find((s) => s.id === id).play()
  // play each screen when it scrolls into view (filtered SVG drawn off-screen doesn't repaint)
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { play(e.target.dataset.id); io.unobserve(e.target) } }), { threshold: .6 })
  SCREENS.forEach((s) => { const ph = $('s-' + s.id).parentElement; ph.dataset.id = s.id; io.observe(ph) })
</script>
